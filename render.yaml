# Render Blueprint — สร้าง Web Service (Node.js) ต่อกับ PostgreSQL ภายนอก (Supabase)
# วิธีใช้: Render Dashboard → New → Blueprint → เลือกรีโพ Cosmo-stock → ใส่ค่า DATABASE_URL → Apply
# DATABASE_URL: ใช้ Supabase "Session pooler" (…pooler.supabase.com:5432) เพราะ Render ต่อ IPv6 ของ direct connection ไม่ได้

services:
  - type: web
    name: cosmostock
    runtime: node
    plan: free            # ฟรีจะหลับหลังไม่มีคนใช้ 15 นาที — ใช้งานจริงเปลี่ยนเป็น starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL          # ใส่เองตอนสร้าง Blueprint (Supabase → Connect → Session pooler)
        sync: false
      - key: PGSSL                 # Supabase ต้องเชื่อมต่อแบบ SSL
        value: require
      - key: ADMIN_PASSWORD        # รหัสเจ้าของร้านตัวอย่าง (admin@cosmostock.app) — สุ่มให้ ดูได้ที่แท็บ Environment
        generateValue: true
      - key: SUPERADMIN_PASSWORD   # รหัสผู้ดูแลระบบ (superadmin@cosmostock.app) — สุ่มให้
        generateValue: true
      - key: BREVO_API_KEY         # ลืมรหัสผ่าน: API key จาก Brevo (SMTP & API → API keys)
        sync: false
      - key: MAIL_FROM             # อีเมลผู้ส่งที่ยืนยันใน Brevo แล้ว
        sync: false
      - key: MAIL_FROM_NAME
        value: CosmoStock
      # - key: SEED_DEMO           # ขึ้นระบบจริง: เปิดบรรทัดนี้เพื่อไม่สร้างข้อมูลตัวอย่าง
      #   value: "0"
