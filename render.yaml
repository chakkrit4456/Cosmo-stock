# Render Blueprint — สร้าง Web Service (Node.js) + PostgreSQL พร้อมเชื่อมกันให้อัตโนมัติ
# วิธีใช้: Render Dashboard → New → Blueprint → เลือกรีโพ Cosmo-stock → Apply
databases:
  - name: cosmostock-db
    databaseName: cosmostock
    user: cosmostock
    plan: free            # ⚠ ฟรีหมดอายุใน 30 วัน (ข้อมูลถูกลบถ้าไม่อัปเกรด) — ใช้งานจริงให้เปลี่ยนเป็นแพ็กเกจเสียเงิน เช่น basic-256mb

services:
  - type: web
    name: cosmostock
    runtime: node
    plan: free            # ฟรีจะหลับหลังไม่มีคนใช้ 15 นาที — ใช้งานจริงเปลี่ยนเป็น starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: cosmostock-db
          property: connectionString
      - key: ADMIN_PASSWORD        # รหัสเจ้าของร้านตัวอย่าง (admin@cosmostock.app) — สุ่มให้ ดูได้ที่แท็บ Environment
        generateValue: true
      - key: SUPERADMIN_PASSWORD   # รหัสผู้ดูแลระบบ (superadmin@cosmostock.app) — สุ่มให้
        generateValue: true
      # - key: SEED_DEMO           # ขึ้นระบบจริง: เปิดบรรทัดนี้เพื่อไม่สร้างข้อมูลตัวอย่าง
      #   value: "0"
